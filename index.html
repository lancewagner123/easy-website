<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Easy Website — Website Building for Small Businesses</title>
<meta name="description" content="Easy Website builds simple, hosting-ready websites for small businesses in Gilbert, Arizona.">
<link rel="canonical" href="https://lancewagner123.github.io/easy-website/">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>

<header class="site-header">
  <div class="container site-header__inner">
    <span class="logo">Easy Website</span>
  </div>
</header>

<main id="main">

  <section class="hero">
    <div class="container">
      <h1>An easy-to-use website builder for small businesses.</h1>
      <p class="hero__sub">Serving Gilbert, Arizona.</p>
    </div>
  </section>

  <section class="portfolio" aria-labelledby="portfolio-heading">
    <div class="container">
      <h2 id="portfolio-heading">Real sites we've built</h2>
      <p>No mockups — these are live, working websites.</p>

      <div class="bento-grid">
        <a class="bento-item bento-item--large"
           href="https://lancewagner123.github.io/que-chevere/"
           target="_blank" rel="noopener">
          <img
            src="img/portfolio-que-chevere-800w.webp"
            srcset="img/portfolio-que-chevere-400w.webp   400w,
                    img/portfolio-que-chevere-800w.webp   800w,
                    img/portfolio-que-chevere-1200w.webp 1200w"
            sizes="(max-width: 700px) 100vw, 60vw"
            width="1600" height="1000"
            decoding="async"
            alt="Que Chevere restaurant website homepage, showing a Venezuelan food platter and the headline Real Venezuelan cooking, made to order">
          <span class="bento-caption">
            <strong>Que Chevere</strong>
            <small>Restaurant &amp; food truck</small>
          </span>
        </a>

        <a class="bento-item"
           href="https://lancewagner123.github.io/akc-electric-llc/"
           target="_blank" rel="noopener">
          <img
            src="img/portfolio-akc-electric-800w.webp"
            srcset="img/portfolio-akc-electric-400w.webp   400w,
                    img/portfolio-akc-electric-800w.webp   800w,
                    img/portfolio-akc-electric-1200w.webp 1200w"
            sizes="(max-width: 700px) 100vw, 40vw"
            width="1600" height="1000"
            decoding="async"
            alt="AKC Electric website homepage, showing a lightning storm photo and the headline Electricians for the Greater Phoenix Area since 1984">
          <span class="bento-caption">
            <strong>AKC Electric</strong>
            <small>Electrical contractor</small>
          </span>
        </a>

        <div class="bento-item bento-item--cta">
          <p>Your business could be next.</p>
        </div>
      </div>
    </div>
  </section>

</main>

<footer class="site-footer">
  <div class="container">
    <p>Easy Website</p>
  </div>
</footer>

<script src="assets/js/main.js"></script>
</body>
</html>
